*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Yu Gothic",sans-serif;color:#182033;background:#151b2b}body{padding:12px}main{max-width:900px;margin:auto}h1{margin:0;font-size:clamp(22px,4vw,34px)}header,.box,.panel{background:#f6f3e7;border:4px solid #101522;box-shadow:6px 6px #101522}header{padding:12px 16px;margin-bottom:10px}header small{font-weight:800;color:#566075}#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}#hud div{background:#fff;border:3px solid #101522;text-align:center;padding:8px;font-weight:900}#gameWrap{position:relative;border:5px solid #101522;background:#78c862;box-shadow:7px 7px #101522;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:12/8;image-rendering:pixelated}.overlay{position:absolute;inset:0;background:#0c111dcc;display:grid;place-items:center;padding:14px;z-index:5}.overlay[hidden]{display:none}.panel{width:min(560px,100%);padding:20px;text-align:center}button,input{font:inherit}button{border:3px solid #101522;background:#ffd45d;padding:10px 16px;font-weight:1000;box-shadow:3px 3px #101522;min-height:44px}button:active{transform:translate(2px,2px);box-shadow:1px 1px #101522}#q{font-size:clamp(34px,7vw,54px);font-weight:1000;margin:12px 0;background:#fff;border:4px solid #101522;padding:16px}#ans{width:100%;border:4px solid #101522;padding:12px;font-size:24px;font-weight:900;margin:8px 0}#msg{font-weight:900;min-height:28px}#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:7px;justify-content:center;margin:14px 0}#pad button{padding:0;font-size:24px;background:#fff}#up{grid-column:2}#left{grid-row:2;grid-column:1}#down{grid-row:2;grid-column:2}#right{grid-row:2;grid-column:3}.info{background:#f6f3e7;border:3px solid #101522;padding:10px 14px;font-weight:800}.hpbar{height:16px;border:3px solid #101522;background:#ddd;margin:5px 0}.hpbar i{display:block;height:100%;background:#ef6461}@media(max-width:650px){body{padding:6px}#hud{grid-template-columns:repeat(2,1fr)}header small{display:block}}
</style></head><body><main><header><h1>英単語Battle</h1><small>中3 → 高3レベル。敵にぶつかり、英単語を入力して倒そう。</small></header><section id="hud"><div>HP<br><b id="php">♥♥♥♥♥</b></div><div>撃破<br><b id="kill">0 / 5</b></div><div>COMBO<br><b id="combo">0×</b></div><div>SCORE<br><b id="score">0</b></div></section><section id="gameWrap"><canvas id="c" width="720" height="480"></canvas><div class="overlay" id="start"><div class="panel"><h2>BLOCK BATTLE</h2><p><b>青い勇者</b>を画面下の矢印で動かし、赤い敵にぶつかろう。<br>日本語を見て英単語を入力。5体撃破でクリア！</p><button id="go">ゲームスタート</button></div></div><div class="overlay" id="battle" hidden><div class="panel"><b id="ename">ENEMY</b><div class="hpbar"><i id="ehp"></i></div><div id="q"></div><form id="form"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英単語を入力"><button>攻撃！</button></form><div id="msg">正解すると攻撃！</div></div></div><div class="overlay" id="result" hidden><div class="panel"><h2 id="rt"></h2><p id="rr"></p><button id="again">もう一度あそぶ</button></div></div></section><div id="pad"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="info">iPad：画面下の矢印で移動。敵との戦闘では画面キーボードで英単語を入力します。PCでは矢印キー／WASDも使えます。</div></main><script>
const W=[["受け入れる","accept",3],["達成する","achieve",3],["助言","advice",3],["〜を許す","allow",3],["現れる","appear",3],["避ける","avoid",3],["〜になる","become",3],["信じる","believe",3],["選ぶ","choose",3],["続ける","continue",3],["決める","decide",3],["説明する","explain",3],["外国の","foreign",3],["起こる","happen",3],["改善する","improve",3],["含む","include",3],["代わりに","instead",3],["興味","interest",3],["必要な","necessary",3],["提供する","provide",3],["理由","reason",3],["受け取る","receive",3],["覚えている","remember",3],["成功する","succeed",3],["影響を与える","affect",4],["利用できる","available",4],["利益","benefit",4],["状況","condition",4],["〜を考慮する","consider",4],["〜を含む","contain",4],["〜に依存する","depend",4],["発展させる","develop",4],["努力","effort",4],["環境","environment",4],["証拠","evidence",4],["存在する","exist",4],["経験","experience",4],["増加する","increase",4],["個人の","individual",4],["知識","knowledge",4],["方法","method",4],["目的","purpose",4],["減らす","reduce",4],["要求する","require",4],["反応する","respond",4],["結果","result",4],["似ている","similar",4],["社会","society",4],["達成する","accomplish",5],["適切な","appropriate",5],["想定する","assume",5],["複雑な","complex",5],["結果として生じる","consequence",5],["かなりの","considerable",5],["消費する","consume",5],["対照","contrast",5],["減少する","decline",5],["示す","demonstrate",5],["効率的な","efficient",5],["強調する","emphasize",5],["不可欠な","essential",5],["評価する","evaluate",5],["要因","factor",5],["機能","function",5],["示す","indicate",5],["解釈する","interpret",5],["維持する","maintain",5],["明らかな","obvious",5],["生じる","occur",5],["可能性","possibility",5],["防ぐ","prevent",5],["原則","principle",5],["関連する","relevant",5],["重要な","significant",5],["十分な","sufficient",5],["傾向","tendency",5]],C=document.querySelector("#c"),X=C.getContext("2d"),CW=60,OBS=[[3,1],[4,1],[8,1],[2,3],[3,3],[7,3],[8,3],[9,3],[5,5],[6,5],[1,6],[9,6]],N=["レッドスライム","ブロックゴーレム","ワードバット","スペルウルフ","ダークキューブ"];let s,e,w,last=[];const $=x=>document.querySelector(x),H={php:$("#php"),kill:$("#kill"),combo:$("#combo"),score:$("#score")};function init(play=0){s={p:{x:0,y:7,h:5},k:0,c:0,b:0,sc:0,phase:play?"map":"start",es:[[10,1],[6,2],[1,2],[10,5],[4,6]].map((a,i)=>({x:a[0],y:a[1],h:2,n:N[i]}))};$("#start").hidden=!!play;$("#battle").hidden=1;$("#result").hidden=1;hud();draw()}function hud(){H.php.textContent="♥".repeat(s.p.h)+"♡".repeat(5-s.p.h);H.kill.textContent=s.k+" / 5";H.combo.textContent=s.c+"×";H.score.textContent=s.sc}function pick(){let min=s.k<2?3:s.k<4?4:5,a=W.map((v,i)=>v[2]==min?i:-1).filter(i=>i>=0),i;do{i=a[Math.floor(Math.random()*a.length)]}while(last.includes(i)&&a.length>3);last.push(i);if(last.length>3)last.shift();return W[i]}function block(x,y){return OBS.some(a=>a[0]==x&&a[1]==y)}function move(dx,dy){if(s.phase!="map")return;let x=s.p.x+dx,y=s.p.y+dy;if(x<0||x>11||y<0||y>7||block(x,y))return;s.p.x=x;s.p.y=y;draw();let z=s.es.find(a=>a.h>0&&a.x==x&&a.y==y);if(z)fight(z)}function fight(z){s.phase="fight";e=z;next();$("#ename").textContent=e.n;eh();$("#battle").hidden=0;setTimeout(()=>$("#ans").focus(),80)}function next(){w=pick();$("#q").textContent=w[0];$("#ans").value="";$("#msg").textContent="正解すると攻撃！";setTimeout(()=>$("#ans").focus(),30)}function eh(){$("#ehp").style.width=Math.max(0,e.h)/2*100+"%"}$("#form").onsubmit=q=>{q.preventDefault();let a=$("#ans").value.trim().toLowerCase().normalize("NFKC").replace(/\s/g,"");if(!a)return;if(a==w[1]){s.c++;s.b=Math.max(s.b,s.c);let d=s.c%3==0?2:1;e.h-=d;s.sc+=100+s.c*20+(d==2?100:0);$("#msg").textContent=d==2?"正解！3コンボ必殺攻撃！":"正解！ "+w[1]+" で攻撃！";eh();hud();if(e.h<=0)setTimeout(win,450);else setTimeout(next,450)}else{s.c=0;s.p.h--;$("#msg").textContent="正解は「"+w[1]+"」。敵の反撃！";hud();if(s.p.h<=0)setTimeout(()=>end(0),700);else setTimeout(next,800)}};function win(){s.k++;s.sc+=250;$("#battle").hidden=1;hud();draw();if(s.k>=5)end(1);else s.phase="map"}function end(ok){s.phase="end";$("#battle").hidden=1;$("#result").hidden=0;$("#rt").textContent=ok?"MISSION CLEAR!":"GAME OVER";$("#rr").textContent=ok?"5体撃破！ スコア "+s.sc+" / 最大コンボ "+s.b:"覚えた単語でもう一度挑戦しよう！"}function rect(x,y,b,d,l,p=8){let q=x*CW+p,r=y*CW+p,z=CW-p*2;X.fillStyle="#101522";X.fillRect(q-3,r-3,z+6,z+6);X.fillStyle=b;X.fillRect(q,r,z,z);X.fillStyle=l;X.fillRect(q+4,r+4,z-8,6);X.fillStyle=d;X.fillRect(q+z-8,r+8,4,z-12);X.fillRect(q+8,r+z-8,z-12,4)}function draw(){for(let y=0;y<8;y++)for(let x=0;x<12;x++){X.fillStyle=(x+y)%2?"#70bf5c":"#78c862";X.fillRect(x*CW,y*CW,CW,CW);X.strokeStyle="#2c713344";X.strokeRect(x*CW+.5,y*CW+.5,CW-1,CW-1)}OBS.forEach(a=>rect(a[0],a[1],"#8793a2","#596674","#b9c1cb",4));s.es.filter(a=>a.h>0).forEach(a=>{rect(a.x,a.y,"#eb5757","#9e292d","#ff9898");X.fillStyle="#171c29";X.fillRect(a.x*CW+20,a.y*CW+22,6,6);X.fillRect(a.x*CW+35,a.y*CW+22,6,6)});rect(s.p.x,s.p.y,"#45a9eb","#1d6598","#8bd1ff");X.fillStyle="#f4d7aa";X.fillRect(s.p.x*CW+21,s.p.y*CW+15,18,17)}document.addEventListener("keydown",q=>{let k=q.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(m[k]){q.preventDefault();move(...m[k])}});[["#up",0,-1],["#down",0,1],["#left",-1,0],["#right",1,0]].forEach(a=>$(a[0]).onpointerdown=q=>{q.preventDefault();move(a[1],a[2])});$("#go").onclick=()=>init(1);$("#again").onclick=()=>init(1);init();
</script></body></html>
